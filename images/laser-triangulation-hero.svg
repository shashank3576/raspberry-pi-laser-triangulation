<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
<title id="title">Laser triangulation for non-contact height measurement</title>
<desc id="desc">A technical illustration showing a laser emitter projecting onto a target, an angled camera observing the spot, spot displacement on the image sensor, and a calibrated height output.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1424"/><stop offset=".55" stop-color="#14263b"/><stop offset="1" stop-color="#203b50"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b3148"/><stop offset="1" stop-color="#13253a"/></linearGradient>
 <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6479" stop-opacity=".15"/><stop offset=".8" stop-color="#ff6479" stop-opacity=".9"/><stop offset="1" stop-color="#ffb1a1" stop-opacity=".95"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#56c9b3"/><stop offset="1" stop-color="#a0ead6"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8fa8c2" stroke-opacity=".09" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="500" rx="26" fill="url(#bg)"/>
<rect width="1400" height="500" rx="26" fill="url(#grid)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <text x="48" y="52" fill="#91e2d0" font-size="12" font-weight="750" letter-spacing="2.5">OPTICAL INSTRUMENTATION  /  RASPBERRY PI</text>
 <text x="48" y="104" fill="#f3f7fb" font-size="34" font-weight="750">Laser triangulation</text>
 <text x="48" y="137" fill="#b6c8d9" font-size="18">Non-contact height measurement</text>
 <path d="M48 160H1352" stroke="#7690aa" stroke-opacity=".38"/>
 <!-- geometry field -->
 <rect x="40" y="183" width="840" height="272" rx="18" fill="#0c1b2b" fill-opacity=".7" stroke="#35516a"/>
 <text x="64" y="211" fill="#9fb4c8" font-size="11" font-weight="700" letter-spacing="1.6">TRIANGULATION GEOMETRY</text>
 <!-- optical bench -->
 <path d="M94 408H824" stroke="#607c96" stroke-width="3" stroke-linecap="round"/>
 <path d="M110 415H808" stroke="#344d65" stroke-width="9" stroke-linecap="round" opacity=".7"/>
 <!-- target block -->
 <path d="M454 352 L607 352 L607 407 L454 407 Z" fill="#26465d" stroke="#7292aa" stroke-width="1.5"/>
 <path d="M454 352L483 335H636L607 352Z" fill="#385c72" stroke="#7292aa" stroke-width="1.2"/>
 <path d="M607 352L636 335V390L607 407Z" fill="#1c354a" stroke="#54738b" stroke-width="1.2"/>
 <text x="488" y="383" fill="#d9e7f1" font-size="12" font-weight="650">TARGET</text>
 <!-- raised target surface -->
 <path d="M454 352H607" stroke="#a5d4e5" stroke-width="2"/>
 <!-- laser source -->
 <rect x="126" y="245" width="100" height="43" rx="8" fill="#243e55" stroke="#69849e" stroke-width="1.5"/>
 <rect x="138" y="254" width="18" height="25" rx="3" fill="#ff6579"/>
 <path d="M164 254H211M164 262H203M164 270H208" stroke="#93abc0" stroke-width="2" stroke-linecap="round"/>
 <text x="126" y="233" fill="#f1f5f9" font-size="12" font-weight="650">LASER EMITTER</text>
 <!-- laser beam -->
 <path d="M226 266L526 351L526 356Z" fill="url(#beam)" opacity=".75"/>
 <path d="M226 266L526 354" stroke="#ff7180" stroke-width="2.2" filter="url(#glow)"/>
 <circle cx="526" cy="354" r="8" fill="#ff667a" opacity=".25" filter="url(#glow)"/>
 <circle cx="526" cy="354" r="3.5" fill="#ff9a9e"/>
 <!-- camera -->
 <g transform="translate(688 237) rotate(-16)">
  <rect x="0" y="0" width="104" height="64" rx="10" fill="#253f55" stroke="#8aa3b8" stroke-width="1.6"/>
  <path d="M14 0L24 -10H49L60 0" fill="#253f55" stroke="#8aa3b8" stroke-width="1.5"/>
  <circle cx="54" cy="32" r="23" fill="#0a1929" stroke="#a2b8ca" stroke-width="2"/>
  <circle cx="54" cy="32" r="14" fill="#1b3b53" stroke="#5e839d" stroke-width="1.5"/>
  <circle cx="54" cy="32" r="5" fill="#79d6d0"/>
 </g>
 <text x="700" y="222" fill="#f1f5f9" font-size="12" font-weight="650">CAMERA</text>
 <!-- view ray and sensor position -->
 <path d="M740 296L526 354" stroke="#71d9c4" stroke-width="1.7" stroke-dasharray="6 5" opacity=".95"/>
 <path d="M526 354L740 296" stroke="#71d9c4" stroke-width="1" opacity=".3"/>
 <path d="M531 338L545 334" stroke="#9ce7d7" stroke-width="1.5"/>
 <text x="602" y="325" fill="#9ce7d7" font-size="11">Observed spot</text>
 <!-- height dimension -->
 <path d="M426 352V407" stroke="#f2b36f" stroke-width="1.5"/>
 <path d="M418 352H434M418 407H434" stroke="#f2b36f" stroke-width="1.5"/>
 <text x="402" y="382" fill="#f2b36f" font-size="12" font-weight="700" text-anchor="end">h</text>
 <!-- displacement line -->
 <path d="M520 430H574" stroke="#ff9a9f" stroke-width="1.5"/>
 <path d="M520 424V436M574 424V436" stroke="#ff9a9f" stroke-width="1.5"/>
 <text x="547" y="446" fill="#ffb1b1" font-size="11" text-anchor="middle">Spot shift</text>
 <!-- right-side output card -->
 <rect x="906" y="183" width="446" height="272" rx="18" fill="url(#panel)" stroke="#3a5871"/>
 <text x="934" y="211" fill="#9fb4c8" font-size="11" font-weight="700" letter-spacing="1.6">FROM PIXELS TO MILLIMETRES</text>
 <text x="934" y="249" fill="#f3f7fb" font-size="20" font-weight="700">Calibrated height estimate</text>
 <text x="934" y="273" fill="#b6c8d9" font-size="13">Image position → displacement → height</text>
 <!-- mini plot -->
 <path d="M948 378V300M948 378H1112" stroke="#7690aa" stroke-width="1.3"/>
 <path d="M953 370C978 363 993 351 1010 341S1057 320 1104 306" fill="none" stroke="url(#mint)" stroke-width="3.5" stroke-linecap="round"/>
 <g fill="#f3f7fb" stroke="#63d0b8" stroke-width="2">
  <circle cx="968" cy="365" r="3.5"/><circle cx="990" cy="355" r="3.5"/><circle cx="1015" cy="339" r="3.5"/><circle cx="1047" cy="326" r="3.5"/><circle cx="1080" cy="315" r="3.5"/>
 </g>
 <text x="1030" y="397" fill="#9fb4c8" font-size="10" text-anchor="middle">Spot displacement</text>
 <text x="928" y="340" fill="#9fb4c8" font-size="10" text-anchor="middle" transform="rotate(-90 928 340)">Height</text>
 <path d="M1132 304V379" stroke="#4a657c"/>
 <text x="1154" y="316" fill="#91e2d0" font-size="10" font-weight="750" letter-spacing="1">MODEL</text>
 <text x="1154" y="341" fill="#f3f7fb" font-size="20" font-weight="750">h = f(Δx)</text>
 <text x="1154" y="362" fill="#b6c8d9" font-size="11">Rational fit</text>
 <text x="1154" y="379" fill="#b6c8d9" font-size="11">0–50 mm</text>
 <path d="M934 414H1324" stroke="#48627a"/>
 <circle cx="941" cy="434" r="4" fill="#70d9c3"/>
 <text x="954" y="438" fill="#c6d7e5" font-size="12">Optical geometry</text>
 <circle cx="1092" cy="434" r="4" fill="#ff7b86"/>
 <text x="1105" y="438" fill="#c6d7e5" font-size="12">Experimental calibration</text>
 <text x="48" y="480" fill="#7892a9" font-size="10.5">Concept illustration · Geometry is schematic and not to scale</text>
</g>
</svg>