<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
<title id="title">Laser triangulation for non-contact height measurement</title>
<desc id="desc">Simple schematic: a laser and camera view the same spot on a target. Target height is calibrated from laser-spot displacement in the camera image.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1424"/><stop offset="1" stop-color="#203b50"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8fa8c2" stroke-opacity=".07"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="500" rx="26" fill="url(#bg)"/>
<rect width="1400" height="500" rx="26" fill="url(#grid)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="48" y="52" fill="#91e2d0" font-size="12" font-weight="750" letter-spacing="2.5">OPTICAL INSTRUMENTATION / RASPBERRY PI</text>
  <text x="48" y="104" fill="#f3f7fb" font-size="34" font-weight="750">Laser triangulation</text>
  <text x="48" y="137" fill="#b6c8d9" font-size="18">Non-contact height measurement</text>
  <path d="M48 160H1352" stroke="#7690aa" stroke-opacity=".38"/>

  <rect x="40" y="183" width="840" height="272" rx="18" fill="#0c1b2b" fill-opacity=".78" stroke="#35516a"/>
  <text x="64" y="211" fill="#9fb4c8" font-size="11" font-weight="700" letter-spacing="1.6">TRIANGULATION GEOMETRY</text>

  <!-- Reference plane and target: one clear side view -->
  <path d="M94 408H824" stroke="#607c96" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 416H808" stroke="#344d65" stroke-width="8" stroke-linecap="round" opacity=".7"/>
  <rect x="470" y="350" width="110" height="58" fill="#26465d" stroke="#7292aa" stroke-width="1.5"/>
  <path d="M470 350H580" stroke="#a5d4e5" stroke-width="2.5"/>
  <text x="525" y="382" fill="#d9e7f1" font-size="12" font-weight="650" text-anchor="middle">TARGET</text>

  <!-- Laser source and beam terminate at the spot on the target top -->
  <rect x="126" y="245" width="100" height="43" rx="8" fill="#243e55" stroke="#69849e" stroke-width="1.5"/>
  <rect x="138" y="254" width="18" height="25" rx="3" fill="#ff6579"/>
  <path d="M164 254H211M164 262H203M164 270H208" stroke="#93abc0" stroke-width="2" stroke-linecap="round"/>
  <text x="126" y="233" fill="#f1f5f9" font-size="12" font-weight="650">LASER EMITTER</text>
  <path d="M226 266L520 350" stroke="#ff7180" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="520" cy="350" r="7" fill="#ff7180" opacity=".25" filter="url(#glow)"/>
  <circle cx="520" cy="350" r="3.5" fill="#ff9a9e"/>
  <text x="531" y="337" fill="#ffb1b1" font-size="10.5">Laser spot</text>

  <!-- Camera optical centre and single viewing ray ending at the same spot -->
  <rect x="690" y="220" width="100" height="60" rx="9" fill="#253f55" stroke="#8aa3b8" stroke-width="1.5"/>
  <circle cx="740" cy="250" r="20" fill="#0a1929" stroke="#a2b8ca" stroke-width="2"/>
  <circle cx="740" cy="250" r="12" fill="#1b3b53" stroke="#5e839d" stroke-width="1.5"/>
  <circle cx="740" cy="250" r="4.5" fill="#79d6d0"/>
  <text x="690" y="211" fill="#f1f5f9" font-size="12" font-weight="650">CAMERA</text>
  <path d="M740 250L520 350" stroke="#71d9c4" stroke-width="1.8" stroke-dasharray="6 5"/>

  <!-- Height is measured from reference plane to target top -->
  <path d="M430 350V408" stroke="#f2b36f" stroke-width="1.5"/>
  <path d="M422 350H438M422 408H438" stroke="#f2b36f" stroke-width="1.5"/>
  <text x="414" y="382" fill="#f2b36f" font-size="13" font-weight="700" text-anchor="end">h</text>
  <text x="64" y="440" fill="#9fb4c8" font-size="11">Height h is referenced to the base plane.</text>

  <!-- Output / calibration -->
  <rect x="906" y="183" width="446" height="272" rx="18" fill="#162b40" stroke="#3a5871"/>
  <text x="934" y="211" fill="#9fb4c8" font-size="11" font-weight="700" letter-spacing="1.6">FROM PIXELS TO MILLIMETRES</text>
  <text x="934" y="249" fill="#f3f7fb" font-size="20" font-weight="700">Calibrated height estimate</text>
  <text x="934" y="273" fill="#b6c8d9" font-size="13">Image spot shift Δx (pixels) → height h</text>

  <text x="948" y="295" fill="#9fb4c8" font-size="9.5" font-weight="700" letter-spacing=".7">SCHEMATIC CALIBRATION</text>
  <path d="M958 374V306M958 374H1110" fill="none" stroke="#7690aa" stroke-width="1.3"/>
  <path d="M963 366C986 359 1000 350 1019 339S1062 319 1102 309" fill="none" stroke="#79dbc4" stroke-width="3" stroke-linecap="round"/>
  <g fill="#f3f7fb" stroke="#63d0b8" stroke-width="2">
    <circle cx="978" cy="361" r="3.2"/><circle cx="998" cy="352" r="3.2"/><circle cx="1021" cy="338" r="3.2"/><circle cx="1052" cy="324" r="3.2"/><circle cx="1082" cy="315" r="3.2"/>
  </g>
  <text x="1034" y="395" fill="#9fb4c8" font-size="9.5" text-anchor="middle">Spot displacement (pixels)</text>
  <text x="937" y="341" fill="#9fb4c8" font-size="9.5" text-anchor="middle" transform="rotate(-90 937 341)">Height (mm)</text>

  <path d="M1127 306V377" stroke="#4a657c"/>
  <text x="1148" y="318" fill="#91e2d0" font-size="10" font-weight="750" letter-spacing="1">MODEL</text>
  <text x="1148" y="344" fill="#f3f7fb" font-size="20" font-weight="750">h = f(Δx)</text>
  <text x="1148" y="365" fill="#b6c8d9" font-size="11">Rational fit</text>
  <text x="1148" y="382" fill="#b6c8d9" font-size="11">0–50 mm</text>
  <path d="M934 414H1324" stroke="#48627a"/>
  <circle cx="941" cy="434" r="4" fill="#70d9c3"/>
  <text x="954" y="438" fill="#c6d7e5" font-size="12">Optical geometry</text>
  <circle cx="1092" cy="434" r="4" fill="#ff7b86"/>
  <text x="1105" y="438" fill="#c6d7e5" font-size="12">Calibration data</text>
  <text x="48" y="480" fill="#7892a9" font-size="10.5">Concept illustration · Geometry is schematic and not to scale</text>
</g>
</svg>